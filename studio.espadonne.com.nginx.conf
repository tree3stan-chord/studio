# nginx config for studio.espadonne.com
# Copy to /etc/nginx/sites-available/ and symlink to sites-enabled

server {
    listen 80;
    server_name studio.espadonne.com;

    root /var/www/studio.espadonne.com/current;
    index index.html;

    access_log /var/log/nginx/studio.espadonne.access.log;
    error_log  /var/log/nginx/studio.espadonne.error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Required for SharedArrayBuffer (FFmpeg WASM)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Next.js static export - handle client-side routing
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Static assets with long cache
    location /_next/static/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Other static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp3|wav|ogg|flac)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;
}
